# Gateway Service Configuration
# LLM Gateway - 统一使用阿里云百炼 (DashScope)

service:
  name: "INFOAGEN LLM Gateway"
  version: "0.1.0"
  host: "0.0.0.0"
  port: 9000
  log_level: "INFO"

calling_mode: "balance"

request_timeout:
  chat: 600
  embedding: 60
  reranker: 60

global_limits:
  enabled: false
  rpm: 3000
  tpm: 150000

providers:
  dashscope:
    name: "DashScope"
    enabled: true
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: "${DASHSCOPE_API_KEY}"
    limits:
      rpm: 10000
      tpm: 1000000
    chat_models:
      - id: "qwen-plus"
        model: "qwen-plus"
        enabled: true
        limits:
          rpm: 10000
          tpm: 1000000
        description: "Qwen-Plus"
    embedding_models:
      - id: "bge-m3"
        model: "text-embedding-v4"
        enabled: true
        limits:
          rpm: 2000
          tpm: 1000000
        description: "text-embedding-v4 (兼容旧模型名 bge-m3)"
      - id: "text-embedding-v4"
        model: "text-embedding-v4"
        enabled: true
        limits:
          rpm: 2000
          tpm: 1000000
        description: "text-embedding-v4"
    reranker_models:
      - id: "bge-reranker-v2-m3"
        model: "gte-rerank-v2"
        enabled: true
        limits:
          rpm: 1000
          tpm: 500000
        description: "gte-rerank-v2 (兼容旧模型名 bge-reranker-v2-m3)"
      - id: "gte-rerank-v2"
        model: "gte-rerank-v2"
        enabled: true
        limits:
          rpm: 1000
          tpm: 500000
        description: "gte-rerank-v2"

retry:
  max_attempts: 3
  initial_delay: 1.0
  exponential_base: 2.0
  max_delay: 30.0
  jitter: true

logging:
  level: "INFO"
  format: "[%(asctime)s] [%(name)s] [%(levelname)s] %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
