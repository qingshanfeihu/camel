<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLI 知识子图</title>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #1e1e1e; color: #e0e0e0; }
    #toolbar {
      padding: 8px 12px; background: #2d2d2d; border-bottom: 1px solid #444;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    #toolbar input { padding: 6px 10px; border-radius: 4px; border: 1px solid #555; background: #333; color: #fff; min-width: 200px; }
    #toolbar button { padding: 6px 12px; border-radius: 4px; border: none; background: #4A90D9; color: #fff; cursor: pointer; }
    #toolbar button:hover { filter: brightness(1.1); }
    #meta { font-size: 12px; color: #aaa; max-width: 900px; }
    #network { width: 100%; height: calc(100vh - 120px); background: #252525; }
    #legend {
      padding: 8px 12px; font-size: 12px; color: #bbb; border-top: 1px solid #444; background: #2d2d2d;
    }
    #legend span { margin-right: 16px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  </style>
</head>
<body>
  <div id="toolbar">
    <label>布局
      <select id="layoutMode" title="层级树仅保留模块–命令结构边（contains/has_operation/parent_of），隐藏 shares_keyword">
        <option value="tree" selected>层级树（像叶子）</option>
        <option value="force">力导向（含关键词边）</option>
      </select>
    </label>
    <label>筛选节点 <input type="text" id="search" placeholder="按 label / id 过滤" /></label>
    <button type="button" id="fit">适应画布</button>
    <button type="button" id="exportJson">导出 JSON</button>
    <span id="meta"></span>
  </div>
  <div id="network"></div>
  <div id="legend">
    <span><i class="dot" style="background:#4A90D9;border:1px solid #2E5A8A"></i>module</span>
    <span><i class="dot" style="background:#7CB342;border:1px solid #558B2F"></i>command</span>
    <span><i class="dot" style="background:#FF9800;border:1px solid #E65100"></i>operation_command</span>
    <span><i class="dot" style="background:#7CB342;border:3px solid #00C853"></i>骨架中有 node_id（绿边）</span>
    <span style="color:#888">层级树：上=模块，下=命令/操作叶；力导向=原图谱含跨命令关键词边</span>
  </div>
  <script>
    var TREE_EDGE_TYPES = new Set(['contains', 'has_operation', 'parent_of']);

    function decorateNodes(arr) {
      return (arr || []).map(function (n) {
        var g = n.group || '';
        var shape = 'ellipse';
        var size = 18;
        if (g === 'module') { shape = 'box'; size = 32; }
        else if (g === 'operation_command') { shape = 'triangleDown'; size = 18; }
        var o = {};
        for (var k in n) { if (n.hasOwnProperty(k)) o[k] = n[k]; }
        o.shape = shape;
        o.size = size;
        return o;
      });
    }

    function filterTreeEdges(arr) {
      return (arr || []).filter(function (e) { return TREE_EDGE_TYPES.has(e.title || ''); });
    }

    function buildOptions(layoutMode) {
      var smoothTree = { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.35 };
      var smoothForce = { type: 'continuous' };
      var base = {
        nodes: { font: { color: '#f0f0f0', size: 13 }, scaling: { min: 8, max: 28 } },
        edges: {
          color: { color: '#6a9fb5', highlight: '#fff' },
          smooth: layoutMode === 'tree' ? smoothTree : smoothForce
        },
        interaction: { hover: true, tooltipDelay: 120 }
      };
      if (layoutMode === 'tree') {
        base.layout = {
          hierarchical: {
            enabled: true,
            direction: 'UD',
            sortMethod: 'directed',
            nodeSpacing: 150,
            levelSeparation: 175,
            treeSpacing: 200,
            blockShifting: true,
            edgeMinimization: true,
            parentCentralization: true
          }
        };
        base.physics = false;
      } else {
        base.layout = { hierarchical: false };
        base.physics = {
          enabled: true,
          stabilization: { iterations: 200 },
          barnesHut: { gravitationalConstant: -8000, springConstant: 0.04, springLength: 120 }
        };
      }
      return base;
    }

    const GRAPH_DATA = JSON.parse(__GRAPH_PARSE_ARG__);
    const metaEl = document.getElementById('meta');
    const container = document.getElementById('network');
    var network = null;
    var nodes = null;
    var edges = null;
    var allEdgesFull = GRAPH_DATA.edges || [];

    function updateMeta(layoutMode, edgeCount) {
      var m = GRAPH_DATA.meta || {};
      var modeLabel = layoutMode === 'tree' ? '层级树' : '力导向';
      metaEl.textContent = 'hints: ' + (m.hints || []).join(', ') +
        ' | modules: ' + (m.modules || []).join(', ') +
        ' | nodes: ' + (GRAPH_DATA.nodes || []).length +
        ' | 显示边: ' + edgeCount + ' / 全量 ' + allEdgesFull.length +
        ' | 布局: ' + modeLabel +
        (m.skeleton_loaded ? ' | skeleton ids: ' + (m.skeleton_node_count || 0) : ' | skeleton: off');
    }

    function rebuildNetwork() {
      var layoutMode = document.getElementById('layoutMode').value;
      var toUse = layoutMode === 'tree' ? filterTreeEdges(allEdgesFull) : allEdgesFull.slice();
      if (layoutMode === 'tree' && toUse.length === 0) {
        layoutMode = 'force';
        toUse = allEdgesFull.slice();
        document.getElementById('layoutMode').value = 'force';
      }
      var nd = decorateNodes(GRAPH_DATA.nodes || []);
      if (network) network.destroy();
      nodes = new vis.DataSet(nd);
      edges = new vis.DataSet(toUse);
      network = new vis.Network(container, { nodes: nodes, edges: edges }, buildOptions(layoutMode));
      updateMeta(layoutMode, toUse.length);

      if (layoutMode === 'force') {
        network.once('stabilizationIterationsDone', function () { network.setOptions({ physics: false }); });
      } else {
        network.once('afterDrawing', function () { network.fit({ animation: false }); });
        setTimeout(function () { network.fit({ animation: true }); }, 80);
      }
    }

    rebuildNetwork();
    document.getElementById('layoutMode').addEventListener('change', rebuildNetwork);

    document.getElementById('fit').onclick = function () { network.fit({ animation: true }); };

    document.getElementById('search').addEventListener('input', function () {
      if (!nodes) return;
      var q = (this.value || '').trim().toLowerCase();
      var all = nodes.get();
      var upd = all.map(function (n) {
        var lab = (n.label || '').toLowerCase();
        var id = (n.id || '').toLowerCase();
        var hide = q && lab.indexOf(q) < 0 && id.indexOf(q) < 0;
        return { id: n.id, hidden: hide };
      });
      nodes.update(upd);
    });

    document.getElementById('exportJson').onclick = function () {
      var blob = new Blob([JSON.stringify(GRAPH_DATA, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'cli_subgraph.json';
      a.click();
      URL.revokeObjectURL(a.href);
    };
  </script>
</body>
</html>
